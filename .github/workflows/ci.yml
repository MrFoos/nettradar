name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Samme som venv-et på VPS2, så en bump som brekker her
          # brekker også i produksjon.
          python-version: "3.12"
          cache: pip

      - name: Installer avhengigheter
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Røyktester
        run: pytest tests/ -q
